services:
  - type: web
    name: taskbuddy-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      # Comma-separated list, e.g. https://taskbuddy-frontend.onrender.com
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: taskbuddy-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Set to the backend service's URL + /api, e.g. https://taskbuddy-backend.onrender.com/api
      - key: VITE_API_BASE_URL
        sync: false
